<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Wall – sticky task manager</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Manrope:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/styles.css" />
    <script src="./js/main.js" defer></script>
  </head>
  <body>
    <header
      class="flex flex-wrap items-start justify-between gap-3 px-4 sm:px-5 pt-5 max-w-[1800px] mx-auto w-full"
    >
      <div>
        <h1 class="hand text-5xl leading-none">Wall</h1>
        <p id="stats" class="text-sm mt-1" style="color: var(--muted)"></p>
      </div>
      <div class="flex items-center gap-4 relative">
        <button
          id="me"
          class="avatar"
          type="button"
          aria-label="Settings"
          aria-expanded="false"
          aria-controls="set"
        >
          Me
        </button>
        <div
          id="set"
          class="paper pin hidden absolute right-0 top-full mt-5 w-72 p-4 z-40 space-y-4"
          style="position: absolute"
          role="dialog"
          aria-label="Settings"
        >
          <h2 class="hand text-2xl">Settings</h2>
          <label class="block text-xs font-extrabold uppercase tracking-wide"
            >Your name
            <input
              id="s-name"
              maxlength="20"
              placeholder="Who are you?"
              class="mt-1 font-normal normal-case tracking-normal"
              autocomplete="off"
            />
          </label>
          <div>
            <div class="text-xs font-extrabold uppercase tracking-wide mb-1">
              Theme
            </div>
            <div class="seg" id="s-theme" data-k="theme">
              <button type="button" data-v="light">Light</button
              ><button type="button" data-v="dark">Dark</button
              ><button type="button" data-v="auto">Auto</button>
            </div>
          </div>
          <div>
            <div class="text-xs font-extrabold uppercase tracking-wide mb-1">
              Clock
            </div>
            <div class="seg" id="s-clock" data-k="clock">
              <button type="button" data-v="12">12-hour</button
              ><button type="button" data-v="24">24-hour</button>
            </div>
          </div>
        </div>
        <div class="text-right">
          <div
            id="time"
            class="tn text-3xl sm:text-4xl font-extrabold leading-none"
          ></div>
          <div
            id="date"
            class="text-xs sm:text-sm mt-1"
            style="color: var(--muted)"
          ></div>
        </div>
      </div>
    </header>

    <main
      class="flex flex-col lg:grid lg:grid-cols-[300px_1fr] 2xl:grid-cols-[380px_1fr] gap-7 p-4 sm:p-5 max-w-[1800px] mx-auto"
    >
      <aside class="contents lg:block lg:space-y-7">
        <section class="paper pin order-3 lg:order-none" aria-label="Calendar">
          <div class="cal-head flex items-center justify-between">
            <button
              id="prev"
              class="px-2 text-xl"
              aria-label="Previous month"
              type="button"
            >
              ‹
            </button>
            <h2 id="mon" class="hand text-2xl"></h2>
            <button
              id="next"
              class="px-2 text-xl"
              aria-label="Next month"
              type="button"
            >
              ›
            </button>
          </div>
          <div class="p-3">
            <div
              class="grid grid-cols-7 text-center text-xs mb-1"
              style="color: var(--muted)"
            >
              <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span
              ><span>Fri</span><span>Sat</span><span>Sun</span>
            </div>
            <div id="grid" class="grid grid-cols-7 gap-1"></div>
          </div>
        </section>

        <form
          id="form"
          class="stk pin space-y-3 order-1 lg:order-none"
          style="background-color: #ffe66d"
          aria-label="New task"
        >
          <h2>New sticky</h2>
          <input
            id="f-title"
            class="ti"
            required
            maxlength="60"
            placeholder="Title…"
            aria-label="Task title"
            autocomplete="off"
          />
          <textarea
            id="f-desc"
            rows="3"
            maxlength="140"
            placeholder="Write the details here…"
            aria-label="Description"
          ></textarea>
          <div class="grid grid-cols-2 gap-2">
            <label>Date<input id="f-date" type="date" /></label>
            <label>Time<input id="f-time" type="time" /></label>
          </div>
          <label class="block"
            >Repeat
            <select id="f-rep">
              <option value="none">Does not repeat</option>
              <option value="daily">Daily</option>
              <option value="weekly">Weekly</option>
              <option value="custom">Custom…</option>
            </select>
          </label>
          <div id="custom" class="hidden grid grid-cols-2 gap-2">
            <label
              >Every<input id="f-n" type="number" min="1" max="99" value="2"
            /></label>
            <label
              >Unit<select id="f-u">
                <option value="d">days</option>
                <option value="w">weeks</option>
              </select></label
            >
          </div>
          <fieldset
            class="flex gap-2 flex-wrap"
            aria-label="Note color"
            id="colors"
          ></fieldset>
          <button class="stick w-full" type="submit">
            Stick it on the wall
          </button>
        </form>
      </aside>

      <section class="order-2 lg:order-none min-w-0">
        <div class="flex flex-wrap items-center gap-2 px-2" id="filters"></div>
        <div id="board" class="mt-2"></div>
      </section>
    </main>

  </body>
</html>
